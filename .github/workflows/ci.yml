name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — análise e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Ler a versão fixada do SDK
        run: |
          python3 - <<'PY'
          import json, os
          with open('tool/flutter-sdk.json', encoding='utf-8') as source:
              sdk = json.load(source)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as target:
              target.write(f"FLUTTER_VERSION={sdk['flutterVersion']}\n")
              target.write(f"FLUTTER_REVISION={sdk['frameworkRevision']}\n")
          PY
      - name: Instalar Flutter do repositório oficial
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Verificar SDK e instalar dependências fixadas
        run: |
          dart tool/check_sdk.dart
          flutter pub get --enforce-lockfile
      - name: Análise estática
        run: flutter analyze --no-pub
      - name: Testes Dart e widgets
        run: flutter test --no-pub
      - name: Compilar web com configuração demo
        run: flutter build web --no-pub --dart-define=USE_FIREBASE_EMULATORS=true

  firebase:
    name: Firebase — regras e concorrência
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '25.0.2'
      - name: Instalar ferramentas fixadas
        run: npm --prefix tool/firebase ci --no-audit --no-fund
      - name: Testar Auth e Firestore em demo-bookself
        run: npm --prefix tool/firebase test
